name: Release draft
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify release metadata and checksum artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/main.js dist/manifest.json dist/styles.css dist/SHA256SUMS --draft --verify-tag --title "Issue Bridge $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
